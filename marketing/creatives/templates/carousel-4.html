<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>:root{--w:1080px;--h:1350px}
.canvas>div>i{display:block;height:10px;width:10px;border-radius:9px;background:rgba(255,255,255,.5)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 38%,rgba(251,146,60,.28),rgba(0,0,0,0) 70%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,3,.6) 0%,rgba(20,8,3,0) 18%,rgba(20,8,3,0) 38%,rgba(20,8,3,.9) 62%,rgba(20,8,3,1) 100%)}
.ticket-wrap{position:absolute;left:64px;right:64px;top:820px;transform:rotate(-2.5deg);filter:drop-shadow(0 24px 40px rgba(0,0,0,.55))}
.ticket{display:flex;height:290px;background:linear-gradient(135deg,#fde68a 0%,var(--amber) 45%,#f59e0b 100%);border-radius:30px;color:var(--brand-dark);
  -webkit-mask:radial-gradient(circle 30px at 71% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 30px at 71% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket .main{flex:0 0 71%;padding:22px 30px 22px 36px;display:flex;flex-direction:column;justify-content:center;border-right:4px dashed rgba(107,35,11,.35)}
.ticket .lab{font-size:31px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ticket .num{font-size:205px;font-weight:800;line-height:.86;letter-spacing:-.05em;display:flex;align-items:flex-start}
.ticket .num small{font-size:84px;margin:18px 0 0 8px;line-height:1}
.ticket .stub{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:800}
.ticket .stub b{font-size:62px;line-height:1}
.ticket .stub span{font-size:28px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
</style></head><body><div class="canvas">
<img class="photo" src="../../photos/frozen-pork-marinade-3.jpg" style="object-position:50% 50%;height:880px;-webkit-mask-image:linear-gradient(180deg,#000 75%,transparent 100%)">
<div class="glow"></div><div class="shade"></div>
<div class="brandbar" style="top:48px;left:56px"><img src="../../photos/logo.png"><span class="word">Jenti's Kitchen</span></div>
<div style='position:absolute;top:84px;right:60px;display:flex;gap:10px'><i></i><i></i><i></i><i style='width:34px;background:#fff'></i></div>
<p style="position:absolute;left:64px;right:64px;top:610px;font-family:'Playfair Display',serif;font-weight:800;font-size:76px;line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.6)">Gigitan pertama,<br><em style="color:var(--amber)">kami traktir.</em></p>
<div class="ticket-wrap"><div class="ticket">
  <div class="main"><span class="lab">Voucher pembelian pertama</span><span class="num">35%<small>OFF</small></span></div>
  <div class="stub"><span>Khusus</span><b>Pembeli<br>Baru</b></div>
</div></div>
<div style="position:absolute;left:64px;right:64px;bottom:60px;display:flex;flex-direction:column;gap:22px;align-items:flex-start">
  <span class="cta" style="font-size:34px;padding:24px 44px">Pesan di jentiskitchen.id</span>
  <p class="fine">*Diskon 35% langsung terpakai di checkout untuk pembelian pertama — tanpa perlu daftar. Maks. potongan Rp100.000, khusus produk. Sekali per nomor HP/email.</p>
</div>
</div></body></html>
